<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 48">
  <!-- Brand circuit-trace motif: see Brand Bible board_review (circuit-board
       line art). One run with 30-45deg diagonal jaunts, not pure right
       angles, plus branch/via terminations for variety. Tiled via
       background-repeat: repeat-x / background-size: auto 100% so the real
       aspect ratio (and therefore the angles) is preserved at any width. -->
